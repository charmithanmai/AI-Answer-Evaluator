<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Answer Evaluator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>AI Answer Evaluator</h1>
    <p>How well does the AI-generated answer satisfy the expected answer?</p>
  </header>

  <main>
    <form id="evaluate-form">
      <label for="question">Question</label>
      <textarea id="question" rows="2" placeholder="e.g. Explain deadlock in operating systems."></textarea>

      <label for="reference_answer">Reference Answer</label>
      <textarea id="reference_answer" rows="5" placeholder="Paste the teacher's reference answer here"></textarea>

      <label for="ai_answer">AI Answer</label>
      <textarea id="ai_answer" rows="5" placeholder="Paste the AI-generated answer here"></textarea>

      <p id="error-message" class="error"></p>

      <button type="submit" id="evaluate-btn">EVALUATE</button>
    </form>

    <section id="results" class="hidden">
      <h2>Evaluation Result</h2>

      <div class="overall">
        <span class="overall-label">Overall Score</span>
        <span class="overall-value" id="overall-score">-</span>
      </div>

      <div class="cards">
        <div class="card">
          <span class="card-label">Correctness</span>
          <span class="card-value" id="correctness">-</span>
        </div>
        <div class="card">
          <span class="card-label">Relevance</span>
          <span class="card-value" id="relevance">-</span>
        </div>
        <div class="card">
          <span class="card-label">Completeness</span>
          <span class="card-value" id="completeness">-</span>
        </div>
        <div class="card">
          <span class="card-label">Semantic Similarity</span>
          <span class="card-value" id="semantic-similarity">-</span>
        </div>
        <div class="card">
          <span class="card-label">Concept Coverage</span>
          <span class="card-value" id="concept-coverage">-</span>
        </div>
      </div>

      <div class="feedback">
        <h3>Feedback</h3>
        <p id="feedback-text"></p>
      </div>
            <div class="concepts">
        <h3>Concepts</h3>
        <p id="concepts-summary"></p>
        <ul id="missing-list"></ul>
      </div>
    </section>
        <section id="history-section">
      <h2>History</h2>
      <p id="history-empty">No evaluations yet.</p>
      <div id="history-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
